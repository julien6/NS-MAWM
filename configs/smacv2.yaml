collection:
  episodes: 1000
  seed: 20000
  split_seed: 0
control:
  alpha: 0.2
  burn_in: 10
  checkpoint_interval: 25000
  gamma: 0.99
  real_ratio: 0.5
  real_steps: 1000000
  rollout_cap: 5
  tau: 0.005
data: outputs/smacv2/data
environment:
  agents: 5
  max_steps: 120
  map_name: 10gen_terran
  benchmark_commit: 577ab5a2cff2391f8df582da5731ea9cd6adf3c6
evaluation:
  fixed_block_set: union_of_versions
  horizon: 25
  diagnostics_mode: both
llm:
  allowed_sources:
  - public_docs
  - expert_statement
  - paper_description
  endpoint: http://localhost:8000/v1
  max_candidates: 4
  model: qwen3.6-35b-a3b-nvfp4
  temperature: 0.2
  token_budget: 400000
  seeds:
  - 0
  - 1
  - 2
output: outputs/smacv2/runs
rules:
  filter:
    scope:
    - individual
    - joint
run:
  env: smacv2
  experiment: prediction
  seed: 0
seeds: 10
stats:
  comparisons:
  - env: smacv2
    left_condition: regularization
    right_condition: B1
    metric: mse
    family: RQ1
  - env: smacv2
    left_condition: B2
    right_condition: B1
    metric: mse
    family: RQ1
  - env: smacv2
    left_condition: B6
    right_condition: B2
    metric: mse
    family: RQ1
  - env: smacv2
    left_condition: regularization
    right_condition: A1
    metric: mse
    family: RQ1
  - env: smacv2
    left_condition: regularization
    right_condition: A5
    metric: mse
    family: RQ1
  - env: smacv2
    left_condition: refined
    right_condition: A2
    metric: mse
    family: RQ2
  - env: smacv2
    left_condition: refined
    right_condition: A4
    metric: mse
    family: RQ2
  resamples: 10000
threads: 1
world_model:
  backbone: jopm_lstm
  lambda: 1.0
  optim:
    batch_seqs: 32
    burn_in: 10
    checkpoint_interval: 1000
    lr: 0.0003
    seq_len: 50
    updates: 20000
  sizes:
    dec:
    - 256
    - 256
    enc:
    - 256
    - 256
    g:
    - 256
    - 256
    lstm: 256
  strategy: regularization
